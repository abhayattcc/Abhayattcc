<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kid-Friendly Website Explorer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans', sans-serif;
            font-weight: bold;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a237e;
        }
        .container {
            text-align: center;
        }
        .navbar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .navbar button {
            padding: 20px 40px;
            font-size: 24px;
            width: 300px;
            cursor: pointer;
            background-color: #4CAF50;
            color: #ffffff;
            border: 2px solid #388E3C;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        .navbar button:hover {
            background-color: #45A049;
        }
        .navbar button:focus {
            outline: 3px solid #2196F3;
        }
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease-out;
        }
        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .logo-container {
            border: 4px solid #4CAF50;
            border-radius: 12px;
            padding: 10px;
            animation: wiggle 0.5s ease-in-out infinite;
        }
        #logo-image {
            width: 200px;
            height: auto;
            animation: wiggle 0.5s ease-in-out infinite;
        }
        #animated-text {
            font-size: 2em;
            white-space: nowrap;
            text-align: center;
            position: relative;
            display: inline-block;
            animation: zoom 2s ease-in-out infinite;
        }
        @keyframes zoom {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        @keyframes wiggle {
            0% { transform: rotate(0deg) translate(0, 0); }
            25% { transform: rotate(2deg) translate(2px, -2px); }
            50% { transform: rotate(0deg) translate(0, 0); }
            75% { transform: rotate(-2deg) translate(-2px, 2px); }
            100% { transform: rotate(0deg) translate(0, 0); }
        }
    </style>
</head>
<body>
    <div id="splash">
        <div class="logo-container">
            <img id="logo-image" src="https://archive.org/download/image_20250904/abhaya.jpg" alt="Brand Logo">
        </div>
        <h1 id="animated-text">Abhayattcc</h1>
    </div>
    <div class="container">
        <div class="navbar" id="navbar">
             <button onclick="window.open('https://abhayattcc.github.io/Notepad/', '_blank')">Notepad</button>
            <button onclick="window.open('https://abhayattcc.github.io/Best-odia-dictionary/', '_blank')">Magic Dictionary</button>
            <button onclick="window.open('https://abhayattcc.github.io/Js/', '_blank')">Super GK Fun</button>
            <button onclick="window.open('https://abhayattcc.github.io/Resume-builder-by-Abhayattcc-/', '_blank')">Cool Resume Maker</button>
            <button onclick="window.open('https://webtoapk.rerebot.com/', '_blank')">Web to APK Wizard</button>
        </div>
    </div>

    <script>
        // IndexedDB setup for storing the image
        const DB_NAME = 'AbhayattccDB';
        const STORE_NAME = 'images';
        const IMAGE_KEY = 'logo';

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    db.createObjectStore(STORE_NAME);
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function storeImageInIndexedDB(url) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const reader = new FileReader();
                return new Promise((resolve) => {
                    reader.onloadend = () => {
                        const base64data = reader.result;
                        openDB().then(db => {
                            const transaction = db.transaction([STORE_NAME], 'readwrite');
                            const store = transaction.objectStore(STORE_NAME);
                            store.put(base64data, IMAGE_KEY);
                            resolve(base64data);
                        });
                    };
                    reader.readAsDataURL(blob);
                });
            } catch (error) {
                console.error('Failed to store image in IndexedDB:', error);
                return url;
            }
        }

        async function getImageFromIndexedDB() {
            try {
                const db = await openDB();
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                return new Promise((resolve, reject) => {
                    const request = store.get(IMAGE_KEY);
                    request.onsuccess = () => {
                        resolve(request.result || 'https://archive.org/download/image_20250904/abhaya.jpg');
                    };
                    request.onerror = () => reject(request.error);
                });
            } catch (error) {
                console.error('Failed to get image from IndexedDB:', error);
                return 'https://archive.org/download/image_20250904/abhaya.jpg';
            }
        }

        // Inline Service Worker
        const swCode = `
            const CACHE_NAME = 'abhayattcc-v1';
            const urlsToCache = [
                '/',
                '/index.html'
            ];

            self.addEventListener('install', (event) => {
                event.waitUntil(
                    caches.open(CACHE_NAME)
                        .then((cache) => {
                            return cache.addAll(urlsToCache);
                        })
                );
            });

            self.addEventListener('fetch', (event) => {
                event.respondWith(
                    caches.match(event.request)
                        .then((response) => {
                            if (response) {
                                return response;
                            }
                            return fetch(event.request).then(
                                (networkResponse) => {
                                    if (!networkResponse || networkResponse.status !== 200 || networkResponse.type !== 'basic') {
                                        return networkResponse;
                                    }
                                    const responseToCache = networkResponse.clone();
                                    caches.open(CACHE_NAME)
                                        .then((cache) => {
                                            cache.put(event.request, responseToCache);
                                        });
                                    return networkResponse;
                                }
                            );
                        })
                );
            });

            self.addEventListener('activate', (event) => {
                event.waitUntil(
                    caches.keys().then((cacheNames) => {
                        return Promise.all(
                            cacheNames.filter((name) => name !== CACHE_NAME)
                                .map((name) => caches.delete(name))
                        );
                    })
                );
            });
        `;

        // Register inline service worker and handle splash screen
        window.addEventListener('load', async () => {
            // Load image from IndexedDB or fetch and store it
            const logoImage = document.getElementById('logo-image');
            const imageSrc = await getImageFromIndexedDB();
            logoImage.src = imageSrc;
            if (!imageSrc.startsWith('data:image')) {
                const base64data = await storeImageInIndexedDB(imageSrc);
                logoImage.src = base64data;
            }

            // Splash screen logic
            setTimeout(() => {
                document.getElementById('splash').classList.add('hidden');
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                }, 500);
            }, 5000);

            // Register service worker from inline code
            if ('serviceWorker' in navigator) {
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl)
                    .then(reg => console.log('Service Worker registered:', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            }
        });
    </script>
</body>
</html>
