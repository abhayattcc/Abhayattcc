    <script>
        // Simple click sound player
        function playClickSound() {
            const audio = document.getElementById('click-audio');
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }

        // =============================================
        // Inline Service Worker + Cache Storage
        // =============================================
        const swCode = `
            const CACHE_NAME = 'abhayattcc-static-v2';

            const ASSETS = [
                '/',
                '/index.html',
                'https://raw.githubusercontent.com/abhayattcc/Abhaythepolice/refs/heads/abhayattcc/BackgroundEraser_20251001_131431955.jpg',
                'https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/click.mp3',
                'https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap'
            ];

            // Install - cache important assets
            self.addEventListener('install', event => {
                event.waitUntil(
                    caches.open(CACHE_NAME)
                        .then(cache => cache.addAll(ASSETS))
                        .then(() => self.skipWaiting())
                );
            });

            // Activate - clean old caches
            self.addEventListener('activate', event => {
                event.waitUntil(
                    caches.keys().then(cacheNames => {
                        return Promise.all(
                            cacheNames.filter(name => name !== CACHE_NAME)
                                .map(name => caches.delete(name))
                        );
                    })
                    .then(() => self.clients.claim())
                );
            });

            // Fetch strategy: Cache First, then Network + update cache
            self.addEventListener('fetch', event => {
                const url = new URL(event.request.url);

                // Only handle GET requests and our known domains
                if (event.request.method !== 'GET') return;

                event.respondWith(
                    caches.match(event.request)
                        .then(cachedResponse => {
                            // Return from cache if found
                            if (cachedResponse) {
                                return cachedResponse;
                            }

                            // Otherwise try network
                            return fetch(event.request)
                                .then(networkResponse => {
                                    // Don't cache non-successful responses or non-basic type
                                    if (!networkResponse || 
                                        networkResponse.status !== 200 || 
                                        networkResponse.type !== 'basic' &&
                                        !url.href.includes('raw.githubusercontent.com')) {
                                        return networkResponse;
                                    }

                                    // Cache successful response
                                    const responseToCache = networkResponse.clone();
                                    caches.open(CACHE_NAME)
                                        .then(cache => {
                                            cache.put(event.request, responseToCache);
                                        });

                                    return networkResponse;
                                })
                                .catch(() => {
                                    // Fallback: return cached version if exists (even stale)
                                    return caches.match(event.request);
                                });
                        })
                );
            });
        `;

        // Register inline service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);

                navigator.serviceWorker.register(swUrl)
                    .then(reg => {
                        console.log('Service Worker registered (inline)', reg);
                    })
                    .catch(err => {
                        console.error('Service Worker registration failed:', err);
                    });
            });
        }
    </script>
