    <script>
        // IndexedDB setup (kept for logo caching only)
        const DB_NAME = 'AbhayattccDB';
        const STORE_NAME = 'resources';
        const HTML_KEY = 'index.html';
        const IMAGE_KEY = 'logo';
        const CLICK_AUDIO_KEY = 'click-audio';

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    db.createObjectStore(STORE_NAME);
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function storeResourceInIndexedDB(key, data) {
            try {
                const db = await openDB();
                const tx = db.transaction([STORE_NAME], 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                await store.put(data, key);
            } catch (e) { console.error(e); }
        }

        async function getResourceFromIndexedDB(key, fallbackUrl) {
            try {
                const db = await openDB();
                const tx = db.transaction([STORE_NAME], 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const result = await store.get(key);
                return result || fallbackUrl;
            } catch (e) {
                console.error(e);
                return fallbackUrl;
            }
        }

        // Cache only logo and click sound
        async function cacheResources() {
            try {
                const htmlContent = document.documentElement.outerHTML;
                await storeResourceInIndexedDB(HTML_KEY, htmlContent);

                // Cache logo
                const logoUrl = 'https://archive.org/download/image_20250904/abhaya.jpg';
                const logoResp = await fetch(logoUrl);
                const logoBlob = await logoResp.blob();
                const reader = new FileReader();
                await new Promise((resolve) => {
                    reader.onloadend = () => {
                        storeResourceInIndexedDB(IMAGE_KEY, reader.result);
                        resolve();
                    };
                    reader.readAsDataURL(logoBlob);
                });

                // Cache click sound
                const clickAudioUrl = 'https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/click.mp3';
                const clickResp = await fetch(clickAudioUrl);
                const clickBlob = await clickResp.blob();
                await new Promise((resolve) => {
                    reader.onloadend = () => {
                        storeResourceInIndexedDB(CLICK_AUDIO_KEY, reader.result);
                        resolve();
                    };
                    reader.readAsDataURL(clickBlob);
                });
            } catch (e) { console.error('Caching failed:', e); }
        }

        async function loadResources() {
            const logoImage = document.getElementById('logo-image');
            const clickAudio = document.getElementById('click-audio');

            logoImage.src = await getResourceFromIndexedDB(IMAGE_KEY, 'https://archive.org/download/image_20250904/abhaya.jpg');
            clickAudio.src = await getResourceFromIndexedDB(CLICK_AUDIO_KEY, 'https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/click.mp3');
        }

        function playClickSound() {
            const clickAudio = document.getElementById('click-audio');
            clickAudio.currentTime = 0;
            clickAudio.play().catch(() => {});
        }

        // Service Worker (removed whale.mp3)
        const swCode = `
            const CACHE_NAME = 'abhayattcc-v1';
            const urlsToCache = [
                '/',
                '/index.html',
                'https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/click.mp3',
                'https://archive.org/download/image_20250904/abhaya.jpg',
                'https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap'
            ];

            self.addEventListener('install', (e) => {
                e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache)));
            });

            self.addEventListener('fetch', (e) => {
                e.respondWith(
                    caches.match(e.request).then(resp => resp || fetch(e.request).then(netResp => {
                        if (netResp && netResp.status === 200 && netResp.type === 'basic') {
                            caches.open(CACHE_NAME).then(cache => cache.put(e.request, netResp.clone()));
                        }
                        return netResp;
                    }))
                );
            });

            self.addEventListener('activate', (e) => {
                e.waitUntil(caches.keys().then(names => Promise.all(
                    names.filter(n => n !== CACHE_NAME).map(n => caches.delete(n))
                )));
            });
        `;

        window.addEventListener('load', async () => {
            await cacheResources();
            await loadResources();

            if ('serviceWorker' in navigator) {
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl)
                    .then(() => console.log('SW registered'))
                    .catch(err => console.log('SW failed:', err));
            }
        });
    </script>
