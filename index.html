<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhayattcc</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7fa;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header */
        header {
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 15px 30px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        #logo-image {
            width: 60px;
            height: auto;
            border-radius: 5px;
        }

        .site-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e50;
            margin-left: 10px;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #3498db, #8e44ad);
            color: white;
            text-align: center;
            padding: 120px 20px 60px;
            margin-top: 80px;
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 2.5rem);
            margin-bottom: 15px;
        }

        .hero p {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Features Section */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .feature-card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .feature-card button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(45deg, #3498db, #2980b9);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .feature-card button:hover {
            background: linear-gradient(45deg, #2980b9, #3498db);
        }

        /* Support Control */
        .support-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .support-control button {
            width: 50px;
            height: 50px;
            font-size: 20px;
            color: white;
            background: green;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .support-control button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .support-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            max-width: 400px;
            text-align: center;
            z-index: 2000;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -60%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        /* Footer */
        footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
        }

        footer a {
            color: #3498db;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                padding: 10px 20px;
            }

            .site-title {
                font-size: 1.2rem;
            }

            #logo-image {
                width: 50px;
            }

            .hero {
                padding: 100px 15px 50px;
            }

            .features {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .support-control {
                bottom: 15px;
                right: 15px;
            }

            .support-message {
                max-width: 300px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img id="logo-image" src="https://archive.org/download/image_20250904/abhaya.jpg" alt="Brand Logo">
            <span class="site-title">Abhayattcc</span>
        </div>
    </header>

    <section class="hero">
        <p>Explore Abhayattcc World</p>
    </section>

    <section class="features">
        <div class="feature-card">
            <button onclick="playClickSound(); window.open('https://abhayattcc.github.io/Best-odia-dictionary/')">Dictionary</button>
        </div>
        <div class="feature-card">
            <button onclick="playClickSound(); window.open('https://abhayattcc.github.io/Js/')">General Knowledge</button>
        </div>
        <div class="feature-card">
            <button onclick="playClickSound(); window.open('https://abhayattcc.github.io/Notepad/')">Notepad</button>
        </div>
        <div class="feature-card">
            <button onclick="playClickSound(); window.open('https://abhayattcc.github.io/Resume-builder-by-Abhayattcc-/')">Resume Maker</button>
        </div>
        <div class="feature-card">
            <button onclick="playClickSound(); window.open('https://webtoapk.rerebot.com/')">Web to APK</button>
        </div>
    </section>

    <div class="support-control">
        <button id="support-toggle">👍🏻</button>

    <div class="support-message" id="support-message">
        ଯଦି ଆମର ସେବା ଆପଣଙ୍କୁ ଭଲ ଲାଗୁଛି, ତାହେଲେ ଆପଣଙ୍କ ଅମଙ୍କୁ support କରି ପାରିବେ ।
    </div>

    <footer>
        <p>&copy; 2025 Kid-Friendly Website Explorer. All rights reserved. | <a href="https://github.com/abhayattcc" target="_blank">Contact Us</a></p>
    </footer>

    <audio id="background-audio" loop hidden>
        <source src="https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/whale.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <audio id="click-audio" hidden>
        <source src="https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/click.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        // IndexedDB setup for storing the image
        const DB_NAME = 'AbhayattccDB';
        const STORE_NAME = 'images';
        const IMAGE_KEY = 'logo';

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    db.createObjectStore(STORE_NAME);
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function storeImageInIndexedDB(url) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const reader = new FileReader();
                return new Promise((resolve) => {
                    reader.onloadend = () => {
                        const base64data = reader.result;
                        openDB().then(db => {
                            const transaction = db.transaction([STORE_NAME], 'readwrite');
                            const store = transaction.objectStore(STORE_NAME);
                            store.put(base64data, IMAGE_KEY);
                            resolve(base64data);
                        });
                    };
                    reader.readAsDataURL(blob);
                });
            } catch (error) {
                console.error('Failed to store image in IndexedDB:', error);
                return url;
            }
        }

        async function getImageFromIndexedDB() {
            try {
                const db = await openDB();
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                return new Promise((resolve, reject) => {
                    const request = store.get(IMAGE_KEY);
                    request.onsuccess = () => {
                        resolve(request.result || 'https://archive.org/download/image_20250904/abhaya.jpg');
                    };
                    request.onerror = () => reject(request.error);
                });
            } catch (error) {
                console.error('Failed to get image from IndexedDB:', error);
                return 'https://archive.org/download/image_20250904/abhaya.jpg';
            }
        }

        // Function to play click sound
        function playClickSound() {
            const clickAudio = document.getElementById('click-audio');
            clickAudio.currentTime = 0; // Reset to start
            clickAudio.play().catch(error => console.error('Click sound failed:', error));
        }

        // Inline Service Worker
        const swCode = `
            const CACHE_NAME = 'abhayattcc-v1';
            const urlsToCache = [
                '/',
                '/outside.html',
                'https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/whale.mp3',
                'https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/click.mp3',
                'https://archive.org/download/image_20250904/abhaya.jpg'
            ];

            self.addEventListener('install', (event) => {
                event.waitUntil(
                    caches.open(CACHE_NAME)
                        .then((cache) => {
                            return cache.addAll(urlsToCache);
                        })
                );
            });

            self.addEventListener('fetch', (event) => {
                event.respondWith(
                    caches.match(event.request)
                        .then((response) => {
                            if (response) {
                                return response;
                            }
                            return fetch(event.request).then(
                                (networkResponse) => {
                                    if (!networkResponse || networkResponse.status !== 200 || networkResponse.type !== 'basic') {
                                        return networkResponse;
                                    }
                                    const responseToCache = networkResponse.clone();
                                    caches.open(CACHE_NAME)
                                        .then((cache) => {
                                            cache.put(event.request, responseToCache);
                                        });
                                    return networkResponse;
                                }
                            );
                        })
                );
            });

            self.addEventListener('activate', (event) => {
                event.waitUntil(
                    caches.keys().then((cacheNames) => {
                        return Promise.all(
                            cacheNames.filter((name) => name !== CACHE_NAME)
                                .map((name) => caches.delete(name))
                        );
                    })
                );
            });
        `;

        // Register service worker, load logo, handle background audio, and support button
        window.addEventListener('load', async () => {
            // Load image from IndexedDB or fetch and store it
            const logoImage = document.getElementById('logo-image');
            const imageSrc = await getImageFromIndexedDB();
            logoImage.src = imageSrc;
            if (!imageSrc.startsWith('data:image')) {
                const base64data = await storeImageInIndexedDB('https://archive.org/download/image_20250904/abhaya.jpg');
                logoImage.src = base64data;
            }

            // Register service worker from inline code
            if ('serviceWorker' in navigator) {
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl)
                    .then(reg => console.log('Service Worker registered:', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            }

            // Background audio functionality: play for 1 minute on load and every hour
            const audio = document.getElementById('background-audio');
            const playAudioForOneMinute = () => {
                audio.play().catch(error => console.error('Audio autoplay failed:', error));
                setTimeout(() => {
                    audio.pause();
                    audio.currentTime = 0; // Reset to start for next play
                }, 60000); // Stop after 1 minute (60,000ms)
            };

            // Play audio on initial load
            playAudioForOneMinute();

            // Schedule audio to play for 1 minute every hour
            setInterval(playAudioForOneMinute, 3600000); // Every 1 hour (3,600,000ms)

            // Support button functionality
            const supportButton = document.getElementById('support-toggle');
            const supportMessage = document.getElementById('support-message');
            let timeoutId;

            supportButton.addEventListener('click', () => {
                if (supportMessage.style.display === 'block') {
                    // Hide message and button
                    supportMessage.style.display = 'none';
                    supportButton.style.display = 'none';
                    clearTimeout(timeoutId);
                    // Show button again after 1 minute
                    timeoutId = setTimeout(() => {
                        supportButton.style.display = 'flex';
                    }, 60000);
                } else {
                    // Show message for 3 seconds before opening UPI link
                    supportMessage.style.display = 'block';
                    playClickSound();
                    setTimeout(() => {
                        window.open('upi://pay?pa=9348692218-3@ibl&pn=ABHAYA%20%20BEHERA&mc=0000&mode=02&purpose=00', '_blank');
                        // Auto-dismiss message after 1 minute
                        timeoutId = setTimeout(() => {
                            supportMessage.style.display = 'none';
                            supportButton.style.display = 'none';
                            // Show button again after another minute
                            timeoutId = setTimeout(() => {
                                supportButton.style.display = 'flex';
                            }, 60000);
                        }, 60000);
                    }, 3000); // Delay UPI link opening by 3 seconds
                }
            });
        });
    </script>
</body>
</html>
