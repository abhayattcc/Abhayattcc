<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhayattcc</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7fa;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header */
        header {
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 15px 30px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        #logo-image {
            width: 60px;
            height: auto;
            border-radius: 5px;
        }

        .site-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e50;
            margin-left: 10px;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #3498db, #8e44ad);
            color: white;
            text-align: center;
            padding: 120px 20px 60px;
            margin-top: 80px;
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 2.5rem);
            margin-bottom: 15px;
        }

        .hero p {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Features Section */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .feature-card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .feature-card button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(45deg, #3498db, #2980b9);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .feature-card button:hover {
            background: linear-gradient(45deg, #2980b9, #3498db);
        }

        /* Audio Control */
        .audio-control {
            position: fixed;
            bottom: 60px;
            right: 80px;
            z-index: 1000;
        }

        .audio-control button {
            width: 50px;
            height: 50px;
            font-size: 20px;
            color: white;
            background: #e67e22;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .audio-control button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        /* Support Control */
        .support-control {
            position: fixed;
            bottom: 60px;
            right: 20px;
            z-index: 1000;
        }

        .support-control button {
            width: 50px;
            height: 50px;
            font-size: 20px;
            color: white;
            background: green;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .support-control button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        /* Close Control */
        .close-control {
            position: fixed;
            bottom: 60px;
            right: 20px;
            z-index: 1000;
            display: none;
        }

        .close-control button {
            width: 50px;
            height: 50px;
            font-size: 20px;
            color: white;
            background: #c0392b;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .close-control button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        /* Support Message Bar */
        .support-message-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #e67e22;
            color: white;
            padding: 10px 20px;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.2);
            font-size: clamp(0.9rem, 2vw, 1rem);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .support-message-bar.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Footer */
        footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            margin-bottom: 40px;
        }

        footer a {
            color: #3498db;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                padding: 10px 20px;
            }

            .site-title {
                font-size: 1.2rem;
            }

            #logo-image {
                width: 50px;
            }

            .hero {
                padding: 100px 15px 50px;
            }

            .features {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .audio-control {
                bottom: 55px;
                right: 70px;
            }

            .support-control, .close-control {
                bottom: 55px;
                right: 15px;
            }

            .support-message-bar {
                font-size: 0.85rem;
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body>

    </header>

    <section class="hero">

    <section class="features">

    <audio id="background-audio" hidden>

    <audio id="click-audio" hidden>
        <source src="https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/click.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        // IndexedDB setup for storing HTML, images, and audio
        const DB_NAME = 'AbhayattccDB';
        const STORE_NAME = 'resources';
        const HTML_KEY = 'index.html';
        const IMAGE_KEY = 'logo';
        const BG_AUDIO_KEY = 'background-audio';
        const CLICK_AUDIO_KEY = 'click-audio';

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    db.createObjectStore(STORE_NAME);
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function storeResourceInIndexedDB(key, data) {
            try {
                const db = await openDB();
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                return new Promise((resolve, reject) => {
                    const request = store.put(data, key);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            } catch (error) {
                console.error(`Failed to store ${key} in IndexedDB:`, error);
            }
        }

        async function getResourceFromIndexedDB(key, fallbackUrl) {
            try {
                const db = await openDB();
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                return new Promise((resolve, reject) => {
                    const request = store.get(key);
                    request.onsuccess = () => {
                        resolve(request.result || (fallbackUrl ? fallbackUrl : null));
                    };
                    request.onerror = () => reject(request.error);
                });
            } catch (error) {
                console.error(`Failed to get ${key} from IndexedDB:`, error);
                return fallbackUrl ? fallbackUrl : null;
            }
        }

        // Function to fetch and store resources
        async function cacheResources() {
            try {
                // Cache HTML
                const htmlContent = document.documentElement.outerHTML;
                await storeResourceInIndexedDB(HTML_KEY, htmlContent);

                // Cache logo image
                const logoUrl = 'https://archive.org/download/image_20250904/abhaya.jpg';
                const logoResponse = await fetch(logoUrl);
                const logoBlob = await logoResponse.blob();
                const reader = new FileReader();
                await new Promise((resolve) => {
                    reader.onloadend = () => {
                        storeResourceInIndexedDB(IMAGE_KEY, reader.result);
                        resolve();
                    };
                    reader.readAsDataURL(logoBlob);
                });

                // Cache background audio
                const bgAudioUrl = 'https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/whale.mp3';
                const bgAudioResponse = await fetch(bgAudioUrl);
                const bgAudioBlob = await bgAudioResponse.blob();
                await new Promise((resolve) => {
                    reader.onloadend = () => {
                        storeResourceInIndexedDB(BG_AUDIO_KEY, reader.result);
                        resolve();
                    };
                    reader.readAsDataURL(bgAudioBlob);
                });

                // Cache click audio
                const clickAudioUrl = 'https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/click.mp3';
                const clickAudioResponse = await fetch(clickAudioUrl);
                const clickAudioBlob = await clickAudioResponse.blob();
                await new Promise((resolve) => {
                    reader.onloadend = () => {
                        storeResourceInIndexedDB(CLICK_AUDIO_KEY, reader.result);
                        resolve();
                    };
                    reader.readAsDataURL(clickAudioBlob);
                });
            } catch (error) {
                console.error('Failed to cache resources:', error);
            }
        }

        // Function to load resources from IndexedDB and play audio
        async function loadResources() {
            const logoImage = document.getElementById('logo-image');
            const bgAudio = document.getElementById('background-audio');
            const clickAudio = document.getElementById('click-audio');

            // Load logo image
            const logoSrc = await getResourceFromIndexedDB(IMAGE_KEY, 'https://archive.org/download/image_20250904/abhaya.jpg');
            logoImage.src = logoSrc;

            // Load background audio
            const bgAudioSrc = await getResourceFromIndexedDB(BG_AUDIO_KEY, 'https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/whale.mp3');
            bgAudio.src = bgAudioSrc;

            // Load click audio
            const clickAudioSrc = await getResourceFromIndexedDB(CLICK_AUDIO_KEY, 'https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/click.mp3');
            clickAudio.src = clickAudioSrc;

            // Play background audio after successful loading
            playAudio();
        }

        // Function to play click sound
        function playClickSound() {
            const clickAudio = document.getElementById('click-audio');
            clickAudio.currentTime = 0;
            clickAudio.play().catch(error => console.error('Click sound failed:', error));
        }

        // Function to play background audio
        function playAudio() {
            const audio = document.getElementById('background-audio');
            const audioToggle = document.getElementById('audio-toggle');
            let playCount = 0;
            const maxPlays = 5;

            function updateAudioButton() {
                audioToggle.textContent = audio.paused ? '▶️' : '⏸️';
            }

            if (playCount < maxPlays) {
                audio.play().then(() => {
                    updateAudioButton();
                    playCount++;
                }).catch(error => console.error('Audio playback failed:', error));
            }

            audio.addEventListener('ended', () => {
                if (playCount < maxPlays) {
                    audio.currentTime = 0;
                    audio.play().then(() => {
                        updateAudioButton();
                        playCount++;
                    }).catch(error => console.error('Audio playback failed:', error));
                } else {
                    audio.pause();
                    audio.currentTime = 0;
                    updateAudioButton();
                }
            });

            audioToggle.addEventListener('click', () => {
                playClickSound();
                if (audio.paused) {
                    if (playCount >= maxPlays) {
                        playCount = 0;
                    }
                    audio.play().then(() => {
                        updateAudioButton();
                        playCount++;
                    }).catch(error => console.error('Audio playback failed:', error));
                } else {
                    audio.pause();
                    updateAudioButton();
                }
            });
        }

        // Inline Service Worker
        const swCode = `
            const CACHE_NAME = 'abhayattcc-v1';
            const urlsToCache = [
                '/',
                '/index.html',
                'https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/whale.mp3',
                'https://raw.githubusercontent.com/abhayattcc/Abhayattcc/refs/heads/abhayattcc/click.mp3',
                'https://archive.org/download/image_20250904/abhaya.jpg',
                'https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap'
            ];

            self.addEventListener('install', (event) => {
                event.waitUntil(
                    caches.open(CACHE_NAME)
                        .then((cache) => {
                            return cache.addAll(urlsToCache);
                        })
                );
            });

            self.addEventListener('fetch', (event) => {
                event.respondWith(
                    caches.match(event.request)
                        .then((response) => {
                            if (response) {
                                return response;
                            }
                            return fetch(event.request).then(
                                (networkResponse) => {
                                    if (!networkResponse || networkResponse.status !== 200 || networkResponse.type !== 'basic') {
                                        return networkResponse;
                                    }
                                    const responseToCache = networkResponse.clone();
                                    caches.open(CACHE_NAME)
                                        .then((cache) => {
                                            cache.put(event.request, responseToCache);
                                        });
                                    return networkResponse;
                                }
                            );
                        })
                );
            });

            self.addEventListener('activate', (event) => {
                event.waitUntil(
                    caches.keys().then((cacheNames) => {
                        return Promise.all(
                            cacheNames.filter((name) => name !== CACHE_NAME)
                                .map((name) => caches.delete(name))
                        );
                    })
                );
            });
        `;

        // Register service worker and load resources
        window.addEventListener('load', async () => {
            // Cache all resources
            await cacheResources();

            // Load resources from IndexedDB
            await loadResources();

            // Register service worker
            if ('serviceWorker' in navigator) {
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl)
                    .then(reg => console.log('Service Worker registered:', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            }

            // Support and close button functionality
            const supportButton = document.getElementById('support-toggle');
            const closeButton = document.getElementById('close-support');
            const supportMessageBar = document.getElementById('support-message-bar');
            const supportControl = document.querySelector('.support-control');
            const closeControl = document.querySelector('.close-control');

            // Support button click
            supportButton.addEventListener('click', () => {
                playClickSound();
                supportControl.style.display = 'none';
                closeControl.style.display = 'flex';
                setTimeout(() => {
                    window.open('upi://pay?pa=9348692218-3@ibl&pn=ABHAYA%20%20BEHERA&mc=0000&mode=02&purpose=00', '_blank');
                }, 3000);
            });

            // Close button click
            closeButton.addEventListener('click', () => {
                supportMessageBar.classList.add('hidden');
                closeControl.style.display = 'none';
                setTimeout(() => {
                    supportMessageBar.classList.remove('hidden');
                    supportControl.style.display = 'flex';
                }, 1800000); // 30 minutes
            });
        });
    </script>
</body>
