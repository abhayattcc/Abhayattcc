<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kid-Friendly Website Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(135deg, #ff6f61, #6b7280);
            height: 100vh;
            overflow: hidden;
        }
        .navbar {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: url('https://www.transparenttextures.com/patterns/circles.png'), linear-gradient(135deg, rgba(255, 111, 97, 0.8), rgba(107, 114, 128, 0.8));
            padding: 20px;
            margin-top: 20vh;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: opacity 0.5s ease-in-out;
            width: 90%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .navbar button, .navbar .button {
            width: 100%;
            max-width: 400px;
            padding: 14px;
            font-size: clamp(16px, 4vw, 18px);
            color: white;
            background: linear-gradient(45deg, #ff6f61, #ffb700, #4ecdc4);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            font-family: 'Comic Neue', cursive;
            font-weight: bold;
            text-decoration: none;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
        }
        .navbar button:hover, .navbar .button:hover {
            transform: scale(1.05) translateY(-3px);
            background: linear-gradient(45deg, #4ecdc4, #ffb700, #ff6f61);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            animation: bounce 0.3s ease;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1.05) translateY(-3px); }
            50% { transform: scale(1.1) translateY(-5px); }
        }
        .logo-container {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 100%;
            max-width: 200px;
            display: flex;
            justify-content: center;
        }
        #logo-image {
            width: 100%;
            max-width: 150px;
            height: auto;
            border: 2px solid #4CAF50;
            border-radius: 8px;
        }
        @media (max-width: 600px) {
            .navbar {
                gap: 10px;
                padding: 15px;
                margin-top: 18vh;
                width: 95%;
            }
            .navbar button, .navbar .button {
                padding: 12px;
                font-size: clamp(14px, 3.5vw, 16px);
                max-width: 300px;
            }
            .logo-container {
                max-width: 150px;
            }
            #logo-image {
                max-width: 120px;
            }
        }
    </style>
</head>
<body>
<div class="logo-container">
    <img id="logo-image" src="abhaya.jpg" alt="Brand Logo">
</div>
<div class="navbar" id="navbar">
    <button onclick="window.open('https://abhayattcc.github.io/Best-odia-dictionary/')">Dictionary</button>
    <button onclick="window.open('https://abhayattcc.github.io/Js/')">GK</button>
    <button onclick="window.open('https://abhayattcc.github.io/Notepad/')">Notepad</button>
    <button onclick="window.open('https://abhayattcc.github.io/Resume-builder-by-Abhayattcc-/')">Resume Maker</button>
    <button onclick="window.open('https://webtoapk.rerebot.com/')">Web to APK</button>
</div>
<audio id="background-audio" loop autoplay hidden>
    <source src="https://archive.org/download/singing-bowl/singing-bowl.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>
<script>
    // IndexedDB setup for storing the image
    const DB_NAME = 'AbhayattccDB';
    const STORE_NAME = 'images';
    const IMAGE_KEY = 'logo';

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = () => {
                const db = request.result;
                db.createObjectStore(STORE_NAME);
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function storeImageInIndexedDB(url) {
        try {
            const response = await fetch(url);
            const blob = await response.blob();
            const reader = new FileReader();
            return new Promise((resolve) => {
                reader.onloadend = () => {
                    const base64data = reader.result;
                    openDB().then(db => {
                        const transaction = db.transaction([STORE_NAME], 'readwrite');
                        const store = transaction.objectStore(STORE_NAME);
                        store.put(base64data, IMAGE_KEY);
                        resolve(base64data);
                    });
                };
                reader.readAsDataURL(blob);
            });
        } catch (error) {
            console.error('Failed to store image in IndexedDB:', error);
            return url;
        }
    }

    async function getImageFromIndexedDB() {
        try {
            const db = await openDB();
            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            return new Promise((resolve, reject) => {
                const request = store.get(IMAGE_KEY);
                request.onsuccess = () => {
                    resolve(request.result || 'abhaya.jpg');
                };
                request.onerror = () => reject(request.error);
            });
        } catch (error) {
            console.error('Failed to get image from IndexedDB:', error);
            return 'abhaya.jpg';
        }
    }

    // Inline Service Worker
    const swCode = `
        const CACHE_NAME = 'abhayattcc-v1';
        const urlsToCache = [
            '/',
            '/outside.html',
            'https://archive.org/download/singing-bowl/singing-bowl.mp3'
        ];

        self.addEventListener('install', (event) => {
            event.waitUntil(
                caches.open(CACHE_NAME)
                    .then((cache) => {
                        return cache.addAll(urlsToCache);
                    })
            );
        });

        self.addEventListener('fetch', (event) => {
            event.respondWith(
                caches.match(event.request)
                    .then((response) => {
                        if (response) {
                            return response;
                        }
                        return fetch(event.request).then(
                            (networkResponse) => {
                                if (!networkResponse || networkResponse.status !== 200 || networkResponse.type !== 'basic') {
                                    return networkResponse;
                                }
                                const responseToCache = networkResponse.clone();
                                caches.open(CACHE_NAME)
                                    .then((cache) => {
                                        cache.put(event.request, responseToCache);
                                    });
                                return networkResponse;
                            }
                        );
                    })
            );
        });

        self.addEventListener('activate', (event) => {
            event.waitUntil(
                caches.keys().then((cacheNames) => {
                    return Promise.all(
                        cacheNames.filter((name) => name !== CACHE_NAME)
                            .map((name) => caches.delete(name))
                    );
                })
            );
        });
    `;

    // Register service worker and load logo
    window.addEventListener('load', async () => {
        // Load image from IndexedDB or fetch and store it
        const logoImage = document.getElementById('logo-image');
        const imageSrc = await getImageFromIndexedDB();
        logoImage.src = imageSrc;
        if (!imageSrc.startsWith('data:image')) {
            const base64data = await storeImageInIndexedDB(imageSrc);
            logoImage.src = base64data;
        }

        // Register service worker from inline code
        if ('serviceWorker' in navigator) {
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl)
                .then(reg => console.log('Service Worker registered:', reg))
                .catch(err => console.log('Service Worker registration failed:', err));
        }
    });
</script>
</body>
</html>
