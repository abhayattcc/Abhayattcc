<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kid-Friendly Website Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(135deg, #ff6f61, #6b7280);
            height: 100vh;
            overflow: hidden;
        }
        .navbar {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 170px); /* Adjusted to account for logo height and spacing */
            gap: 40px; /* Increased spacing between buttons */
            background: url('https://www.transparenttextures.com/patterns/circles.png'), rgba(255, 255, 255, 0.2);
            transition: opacity 0.5s ease-in-out;
            padding-top: 170px; /* Ensure buttons don't overlap with logo */
        }
        .navbar button {
            padding: 20px 40px;
            font-size: 24px;
            color: white;
            background: linear-gradient(45deg, #ff6f61, #ffb700);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            width: 200px;
            text-align: center;
        }
        .navbar button:hover {
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4);
            background: linear-gradient(45deg, #ffb700, #ff6f61);
        }
        .content {
            position: relative;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f0f0;
            transition: opacity 0.5s ease-in-out;
        }
        .home-screen {
            text-align: center;
            font-size: 36px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: pulse 3s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .logo-container {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }
        #logo-image {
            width: 150px;
            height: 150px;
            border: 2px solid #4CAF50;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="logo-container">
    <img id="logo-image" src="https://archive.org/download/image_20250904/abhaya.jpg" alt="Brand Logo">
</div>
<div class="navbar" id="navbar">
    <button onclick="window.open('https://abhayattcc.github.io/Best-odia-dictionary/', '_blank')">Dictionary</button>
    <button onclick="window.open('https://abhayattcc.github.io/Js/', '_blank')">GK</button>
    <button onclick="window.open('https://abhayattcc.github.io/Notepad/', '_blank')">Notepad</button>
    <button onclick="window.open('https://abhayattcc.github.io/Resume-builder-by-Abhayattcc-/', '_blank')">Resume Maker</button>
    <button onclick="window.open('https://webtoapk.rerebot.com/', '_blank')">Web to APK</button>
</div>
<div class="content" id="content">
    <div class="home-screen">Welcome to the Fun Website Explorer!</div>
</div>
<script>
    // IndexedDB setup for storing the image
    const DB_NAME = 'AbhayattccDB';
    const STORE_NAME = 'images';
    const IMAGE_KEY = 'logo';

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = () => {
                const db = request.result;
                db.createObjectStore(STORE_NAME);
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function storeImageInIndexedDB(url) {
        try {
            const response = await fetch(url);
            const blob = await response.blob();
            const reader = new FileReader();
            return new Promise((resolve) => {
                reader.onloadend = () => {
                    const base64data = reader.result;
                    openDB().then(db => {
                        const transaction = db.transaction([STORE_NAME], 'readwrite');
                        const store = transaction.objectStore(STORE_NAME);
                        store.put(base64data, IMAGE_KEY);
                        resolve(base64data);
                    });
                };
                reader.readAsDataURL(blob);
            });
        } catch (error) {
            console.error('Failed to store image in IndexedDB:', error);
            return url;
        }
    }

    async function getImageFromIndexedDB() {
        try {
            const db = await openDB();
            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            return new Promise((resolve, reject) => {
                const request = store.get(IMAGE_KEY);
                request.onsuccess = () => {
                    resolve(request.result || 'https://archive.org/download/image_20250904/abhaya.jpg');
                };
                request.onerror = () => reject(request.error);
            });
        } catch (error) {
            console.error('Failed to get image from IndexedDB:', error);
            return 'https://archive.org/download/image_20250904/abhaya.jpg';
        }
    }

    // Inline Service Worker
    const swCode = `
        const CACHE_NAME = 'abhayattcc-v1';
        const urlsToCache = [
            '/',
            '/index.html'
        ];

        self.addEventListener('install', (event) => {
            event.waitUntil(
                caches.open(CACHE_NAME)
                    .then((cache) => {
                        return cache.addAll(urlsToCache);
                    })
            );
        });

        self.addEventListener('fetch', (event) => {
            event.respondWith(
                caches.match(event.request)
                    .then((response) => {
                        if (response) {
                            return response;
                        }
                        return fetch(event.request).then(
                            (networkResponse) => {
                                if (!networkResponse || networkResponse.status !== 200 || networkResponse.type !== 'basic') {
                                    return networkResponse;
                                }
                                const responseToCache = networkResponse.clone();
                                caches.open(CACHE_NAME)
                                    .then((cache) => {
                                        cache.put(event.request, responseToCache);
                                    });
                                return networkResponse;
                            }
                        );
                    })
            );
        });

        self.addEventListener('activate', (event) => {
            event.waitUntil(
                caches.keys().then((cacheNames) => {
                    return Promise.all(
                        cacheNames.filter((name) => name !== CACHE_NAME)
                            .map((name) => caches.delete(name))
                    );
                })
            );
        });
    `;

    // Register service worker and load logo
    window.addEventListener('load', async () => {
        // Load image from IndexedDB or fetch and store it
        const logoImage = document.getElementById('logo-image');
        const imageSrc = await getImageFromIndexedDB();
        logoImage.src = imageSrc;
        if (!imageSrc.startsWith('data:image')) {
            const base64data = await storeImageInIndexedDB(imageSrc);
            logoImage.src = base64data;
        }

        // Register service worker from inline code
        if ('serviceWorker' in navigator) {
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl)
                .then(reg => console.log('Service Worker registered:', reg))
                .catch(err => console.log('Service Worker registration failed:', err));
        }
    });
</script>
</body>
</html>
