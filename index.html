<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kid-Friendly Website Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(135deg, #ff6f61, #6b7280);
            height: 100vh;
            overflow: hidden;
        }
        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-wrap: wrap;
            gap: 20px;
            background: url('https://www.transparenttextures.com/patterns/circles.png'), rgba(255, 255, 255, 0.2);
            transition: transform 0.5s ease-in-out;
        }
        .navbar.hidden {
            transform: translateY(-100%);
        }
        .navbar button {
            padding: 20px 40px;
            font-size: 24px;
            color: white;
            background: linear-gradient(45deg, #ff6f61, #ffb700);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: bounce 2s infinite;
        }
        .navbar button:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4);
            background: linear-gradient(45deg, #ffb700, #ff6f61);
        }
        .navbar button.active {
            background: linear-gradient(45deg, #34d399, #10b981);
        }
        .content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            background: #f0f0f0;
            transition: opacity 0.5s ease-in-out;
        }
        .content.visible {
            display: flex;
            opacity: 1;
        }
        .content iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 15px;
        }
        .home-screen {
            text-align: center;
            font-size: 36px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: pulse 3s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            font-size: 20px;
            color: white;
            background: linear-gradient(45deg, #ef4444, #f97316);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
            z-index: 1000;
            display: none;
        }
        .back-button.visible {
            display: block;
        }
        .back-button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="navbar" id="navbar">
        <button onclick="showPage('https://abhayattcc.github.io/Best-odia-dictionary/')">Dictionary</button>
        <button onclick="showPage('https://abhayattcc.github.io/Js/')">GK</button>
        <button onclick="showPage('https://abhayattcc.github.io/Notepad/')">Notepad</button>
        <button onclick="showPage('https://abhayattcc.github.io/Resume-builder-by-Abhayattcc-/')">Resume Maker</button>
        <button onclick="window.open('https://webtoapk.rerebot.com/', '_blank')">Web to APK</button>
    </div>
    <button class="back-button" id="backButton" onclick="showHome()">🏠</button>
    <div class="content" id="content">
        <div class="home-screen">Welcome to the Fun Website Explorer!</div>
    </div>
    <script>
        function showPage(url) {
            const navbar = document.getElementById('navbar');
            const content = document.getElementById('content');
            const backButton = document.getElementById('backButton');
            navbar.classList.add('hidden');
            content.innerHTML = `<iframe src="${url}" title="Website Frame"></iframe>`;
            content.classList.add('visible');
            backButton.classList.add('visible');
            updateActiveButton(url);
        }

        function showHome() {
            const navbar = document.getElementById('navbar');
            const content = document.getElementById('content');
            const backButton = document.getElementById('backButton');
            navbar.classList.remove('hidden');
            content.innerHTML = '<div class="home-screen">Welcome to the Fun Website Explorer!</div>';
            content.classList.remove('visible');
            backButton.classList.remove('visible');
            updateActiveButton(null);
        }

        function updateActiveButton(url) {
            const buttons = document.querySelectorAll('.navbar button');
            buttons.forEach(button => {
                button.classList.remove('active');
                if (button.onclick.toString().includes(url)) {
                    button.classList.add('active');
                }
            });
        }
    </script>
</body>
</html>
