<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kid-Friendly Website Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(135deg, #ff6f61, #6b7280);
            height: 100vh;
            overflow: hidden;
        }
        .navbar {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 30px;
            background: url('https://www.transparenttextures.com/patterns/circles.png'), rgba(255, 255, 255, 0.2);
            transition: opacity 0.5s ease-in-out;
        }
        .navbar.hidden {
            display: none;
        }
        .navbar button {
            padding: 20px 40px;
            font-size: 24px;
            color: white;
            background: linear-gradient(45deg, #ff6f61, #ffb700);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: bounce 2s infinite;
            width: 200px; /* Fixed width for consistent button size */
            text-align: center;
        }
        .navbar button:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4);
            background: linear-gradient(45deg, #ffb700, #ff6f61);
        }
        .navbar button.active {
            background: linear-gradient(45deg, #34d399, #10b981);
        }
        .content {
            position: relative;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f0f0;
            transition: opacity 0.5s ease-in-out;
        }
        .content.hidden {
            display: none;
        }
        #iframe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: none;
        }
        #iframe-container.visible {
            display: block;
        }
        #content-iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 15px;
        }
        .home-screen {
            text-align: center;
            font-size: 36px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: pulse 3s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            font-size: 20px;
            color: white;
            background: linear-gradient(45deg, #ef4444, #f97316);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
            z-index: 1000;
            display: none;
        }
        .back-button.visible {
            display: block;
        }
        .back-button:hover {
            transform: scale(1.1);
        }
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease-out;
        }
        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .logo-container {
            border: 4px solid #4CAF50;
            border-radius: 12px;
            padding: 10px;
            animation: wiggle 0.5s ease-in-out infinite;
        }
        #logo-image {
            width: 200px;
            height: auto;
            animation: wiggle 0.5s ease-in-out infinite;
        }
        #animated-text {
            font-size: 2em;
            white-space: nowrap;
            text-align: center;
            position: relative;
            display: inline-block;
            animation: zoom 2s ease-in-out infinite;
        }
        @keyframes zoom {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        @keyframes wiggle {
            0% { transform: rotate(0deg) translate(0, 0); }
            25% { transform: rotate(2deg) translate(2px, -2px); }
            50% { transform: rotate(0deg) translate(0, 0); }
            75% { transform: rotate(-2deg) translate(-2px, 2px); }
            100% { transform: rotate(0deg) translate(0, 0); }
        }
    </style>
</head>
<body>
<div id="splash">
    <div class="logo-container">
        <img id="logo-image" src="https://archive.org/download/image_20250904/abhaya.jpg" alt="Brand Logo">
    </div>
    <h1 id="animated-text">Abhayattcc</h1>
</div>
<div class="navbar" id="navbar">
    <button onclick="showPage('https://abhayattcc.github.io/Best-odia-dictionary/')">Dictionary</button>
    <button onclick="showPage('https://abhayattcc.github.io/Js/')">GK</button>
    <button onclick="showPage('https://abhayattcc.github.io/Notepad/')">Notepad</button>
</div>
<button class="back-button" id="backButton" onclick="showHome()">🏠</button>
<div class="content" id="content">
    <div class="home-screen">Welcome to the Fun Website Explorer!</div>
</div>
<div id="iframe-container">
    <iframe id="content-iframe" title="Website Frame"></iframe>
</div>
<script>
    // IndexedDB setup for storing the image
    const DB_NAME = 'AbhayattccDB';
    const STORE_NAME = 'images';
    const IMAGE_KEY = 'logo';

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = () => {
                const db = request.result;
                db.createObjectStore(STORE_NAME);
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function storeImageInIndexedDB(url) {
        try {
            const response = await fetch(url);
            const blob = await response.blob();
            const reader = new FileReader();
            return new Promise((resolve) => {
                reader.onloadend = () => {
                    const base64data = reader.result;
                    openDB().then(db => {
                        const transaction = db.transaction([STORE_NAME], 'readwrite');
                        const store = transaction.objectStore(STORE_NAME);
                        store.put(base64data, IMAGE_KEY);
                        resolve(base64data);
                    });
                };
                reader.readAsDataURL(blob);
            });
        } catch (error) {
            console.error('Failed to store image in IndexedDB:', error);
            return url;
        }
    }

    async function getImageFromIndexedDB() {
        try {
            const db = await openDB();
            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            return new Promise((resolve, reject) => {
                const request = store.get(IMAGE_KEY);
                request.onsuccess = () => {
                    resolve(request.result || 'https://archive.org/download/image_20250904/abhaya.jpg');
                };
                request.onerror = () => reject(request.error);
            });
        } catch (error) {
            console.error('Failed to get image from IndexedDB:', error);
            return 'https://archive.org/download/image_20250904/abhaya.jpg';
        }
    }

    // Inline Service Worker
    const swCode = `
        const CACHE_NAME = 'abhayattcc-v1';
        const urlsToCache = [
            '/',
            '/index.html'
        ];

        self.addEventListener('install', (event) => {
            event.waitUntil(
                caches.open(CACHE_NAME)
                    .then((cache) => {
                        return cache.addAll(urlsToCache);
                    })
            );
        });

        self.addEventListener('fetch', (event) => {
            event.respondWith(
                caches.match(event.request)
                    .then((response) => {
                        if (response) {
                            return response;
                        }
                        return fetch(event.request).then(
                            (networkResponse) => {
                                if (!networkResponse || networkResponse.status !== 200 || networkResponse.type !== 'basic') {
                                    return networkResponse;
                                }
                                const responseToCache = networkResponse.clone();
                                caches.open(CACHE_NAME)
                                    .then((cache) => {
                                        cache.put(event.request, responseToCache);
                                    });
                                return networkResponse;
                            }
                        );
                    })
            );
        });

        self.addEventListener('activate', (event) => {
            event.waitUntil(
                caches.keys().then((cacheNames) => {
                    return Promise.all(
                        cacheNames.filter((name) => name !== CACHE_NAME)
                            .map((name) => caches.delete(name))
                    );
                })
            );
        });
    `;

    // Register inline service worker and handle splash screen
    window.addEventListener('load', async () => {
        // Load image from IndexedDB or fetch and store it
        const logoImage = document.getElementById('logo-image');
        const imageSrc = await getImageFromIndexedDB();
        logoImage.src = imageSrc;
        if (!imageSrc.startsWith('data:image')) {
            const base64data = await storeImageInIndexedDB(imageSrc);
            logoImage.src = base64data;
        }

        // Splash screen logic
        setTimeout(() => {
            document.getElementById('splash').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
            }, 500);
        }, 5000);

        // Register service worker from inline code
        if ('serviceWorker' in navigator) {
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl)
                .then(reg => console.log('Service Worker registered:', reg))
                .catch(err => console.log('Service Worker registration failed:', err));
        }

        // Initialize history state for home page
        history.replaceState({ page: 'home' }, '', '');
    });

    // Handle browser back button
    window.addEventListener('popstate', (event) => {
        if (event.state && event.state.page === 'home') {
            showHome();
        }
    });

    function showPage(url) {
        const navbar = document.getElementById('navbar');
        const content = document.getElementById('content');
        const backButton = document.getElementById('backButton');
        const iframeContainer = document.getElementById('iframe-container');
        const contentIframe = document.getElementById('content-iframe');
        navbar.classList.add('hidden');
        content.classList.add('hidden');
        contentIframe.src = url;
        iframeContainer.classList.add('visible');
        backButton.classList.add('visible');
        updateActiveButton(url);
        // Push new state to history
        history.pushState({ page: 'content', url }, '', `#${encodeURIComponent(url)}`);
    }

    function showHome() {
        const navbar = document.getElementById('navbar');
        const content = document.getElementById('content');
        const backButton = document.getElementById('backButton');
        const iframeContainer = document.getElementById('iframe-container');
        navbar.classList.remove('hidden');
        content.classList.remove('hidden');
        iframeContainer.classList.remove('visible');
        backButton.classList.remove('visible');
        updateActiveButton(null);
        // Update history state to home
        history.pushState({ page: 'home' }, '', '');
    }

    function updateActiveButton(url) {
        const buttons = document.querySelectorAll('.navbar button');
        buttons.forEach(button => {
            button.classList.remove('active');
            if (url && button.onclick.toString().includes(url)) {
                button.classList.add('active');
            }
        });
    }
</script>
</body>
</html>
